<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Bugs 2.0</title>
<style>
*{box-sizing:border-box}
body{font:16px system-ui;background:#0b1020;color:#e8efff;margin:0}
main{max-width:680px;margin:auto;padding:20px}
.card{background:#1a2740;padding:18px;border-radius:14px;margin:15px 0;border:1px solid #344765}
button{background:#7668ed;color:white;border:0;border-radius:9px;padding:13px;font-weight:700}
small{color:#aab9d0}
li{padding:8px 0;border-bottom:1px solid #344765}
.ok{color:#8ce6b3}
.fail{color:#ffbf94}
</style>
</head>
<body>
<main>
<h1>📡 Radar de Bugs</h1>
<small>Versão 2.0 • Sem desconto mínimo • Sem limite de preço</small>
<div class="card">
<h2>Estado da coleta</h2>
<button onclick="load()">Atualizar diagnóstico</button>
<p id="when">Aguardando resultados.</p>
<ul id="stores"></ul>
</div>
<div class="card">
<h2>Possíveis erros de preço</h2>
<p id="offers">Aguardando diagnóstico.</p>
</div>
<p><small>O GitHub Actions roda o scanner. Este painel exibe o último diagnóstico publicado.</small></p>
</main>
<script>
async function load() {
  const when = document.getElementById('when');
  const list = document.getElementById('stores');
  const offers = document.getElementById('offers');
  when.textContent = 'Carregando...';

  try {
    const response = await fetch('./results.json?t=' + Date.now(), {
      cache: 'no-store'
    });
    if (!response.ok) throw Error('HTTP ' + response.status);

    const report = await response.json();
    when.textContent = 'Última execução: ' +
      new Date(report.generated_at).toLocaleString('pt-BR');

    list.replaceChildren();
    for (const source of report.sources) {
      const item = document.createElement('li');
      const extracted = source.status === 'prices_extracted';
      const status = extracted ? 'Preços estruturados extraídos' : 'Coleta não validada';
      item.textContent = `${source.store} — ${status} (${source.products_extracted} produtos)`;
      item.className = extracted ? 'ok' : 'fail';
      list.append(item);
    }

    offers.textContent = report.offers?.length
      ? JSON.stringify(report.offers)
      : 'Nenhum possível erro de preço validado. A análise depende de referências confiáveis.';
  } catch (error) {
    when.textContent = 'Não foi possível carregar o diagnóstico: ' + error.message;
  }
}
load();
</script>
</body>
</html>
